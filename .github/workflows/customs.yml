# Customs inspects the agent manifests and other prompt files a pull request
# changes. Report-only for now: the check is not required in branch protection.
# allow-empty now exists, so pull requests that change only Python or web files
# report NOTHING INSPECTED and pass instead of NOT ASSESSED. What still has to
# happen before the check can be required: branch protection on main would block
# the living-map bot that pushes map.json, so the check has to be required
# through a ruleset with the living-map bot on the bypass list.

name: Customs

on: pull_request

permissions:
  contents: read

jobs:
  customs:
    name: Customs (manifests and docs)
    uses: SAAF-Project/customs/.github/workflows/customs-reusable.yml@180829c8c6a98e4c4ebfe162d78de85dde6c8022 # v1.2.0
    with:
      customs-ref: 180829c8c6a98e4c4ebfe162d78de85dde6c8022 # v1.2.0
      allow-empty: true
