# Customs inspects the agent manifests and other prompt files a pull request
# changes. Report-only for now: the check is not required in branch protection,
# because pull requests that change only Python or web files report NOT ASSESSED.

name: Customs

on: pull_request

permissions:
  contents: read

jobs:
  customs:
    uses: SAAF-Project/customs/.github/workflows/customs-reusable.yml@02e3cf1e4678c36a816ecfd31a9d22ba366dd07a # v1.1.0
    with:
      customs-ref: 02e3cf1e4678c36a816ecfd31a9d22ba366dd07a # v1.1.0
