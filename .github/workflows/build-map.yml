name: Build living map

on:
  pull_request:
    paths: [repos.txt, "manifests/**", "scripts/**", "tests/**", agent.example.yaml, .github/workflows/build-map.yml]
  push:
    branches: [main]
    paths: [repos.txt, "manifests/**", scripts/build_map.py, "tests/**"]
  schedule:
    - cron: "17 * * * *"   # hourly: picks up agent.yaml changes in the agent repos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs on every trigger, pull requests included: the only job a PR gets.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -m unittest discover tests

  # Builds and commits map.json: push to main, schedule and manual dispatch only,
  # never from a pull request.
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/build_map.py
        env:
          GITHUB_TOKEN: ${{ secrets.SAAF_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit map.json if it changed
        run: |
          git config user.name "living-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map.json
          if git diff --cached --quiet -- map.json; then echo "no change"; exit 0; fi
          git commit -m "Update map.json"
          git push
