name: Build living map

on:
  pull_request:
  push:
    branches: [main]
    paths: [repos.txt, "manifests/**", scripts/build_map.py, "tests/**"]
  schedule:
    - cron: "17 * * * *"   # hourly: picks up agent.yaml changes in the agent repos
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-map-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on every trigger, pull requests included: the only job a PR gets.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: node --version
      - run: python -m unittest discover tests

  # Builds and commits map.json: push to main, schedule and manual dispatch only,
  # never from a pull request.
  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_map.py
        env:
          GITHUB_TOKEN: ${{ secrets.SAAF_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit map.json if it changed
        run: |
          git config user.name "living-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map.json
          if git diff --cached --quiet -- map.json; then echo "no change"; exit 0; fi
          git commit -m "Update map.json"
          git push
